<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Orbital Ring 1: Cyan/Blue -->
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Orbital Ring 2: Emerald/Teal -->
    <linearGradient id="ringTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Orbital Ring 3: Violet/Rose -->
    <linearGradient id="ringViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Core Nucleus Glow -->
    <radialGradient id="coreGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Electron Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with Subtle Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <g transform="translate(256, 256)">
    <!-- Orbital Ring 1 (Rotated -30 deg) -->
    <ellipse rx="190" ry="72" transform="rotate(-30)" fill="none" stroke="url(#ringCyan)" stroke-width="14" stroke-dasharray="1000" opacity="0.9" filter="url(#glow)" />

    <!-- Orbital Ring 2 (Rotated 30 deg) -->
    <ellipse rx="190" ry="72" transform="rotate(30)" fill="none" stroke="url(#ringTeal)" stroke-width="14" stroke-dasharray="1000" opacity="0.9" filter="url(#glow)" />

    <!-- Orbital Ring 3 (Rotated 90 deg) -->
    <ellipse rx="190" ry="72" transform="rotate(90)" fill="none" stroke="url(#ringViolet)" stroke-width="14" stroke-dasharray="1000" opacity="0.9" filter="url(#glow)" />

    <!-- Orbiting Electrons -->
    <!-- Electron 1 (On cyan ring) -->
    <circle cx="160" cy="-92" r="15" fill="#e0f2fe" filter="url(#glow)" />
    <circle cx="160" cy="-92" r="8" fill="#ffffff" />

    <!-- Electron 2 (On teal ring) -->
    <circle cx="-160" cy="-92" r="15" fill="#d1fae5" filter="url(#glow)" />
    <circle cx="-160" cy="-92" r="8" fill="#ffffff" />

    <!-- Electron 3 (On violet ring) -->
    <circle cx="0" cy="185" r="15" fill="#f3e8ff" filter="url(#glow)" />
    <circle cx="0" cy="185" r="8" fill="#ffffff" />

    <!-- Central Quantum Nucleus -->
    <circle cx="0" cy="0" r="52" fill="url(#coreGlow)" filter="url(#glow)" />
    <circle cx="-14" cy="-14" r="18" fill="#ffffff" opacity="0.75" />

    <!-- Subatomic Protons/Neutrons Cluster Overlay -->
    <circle cx="12" cy="-10" r="14" fill="#38bdf8" opacity="0.8" />
    <circle cx="-8" cy="14" r="15" fill="#34d399" opacity="0.8" />
    <circle cx="14" cy="12" r="13" fill="#a855f7" opacity="0.8" />
  </g>
</svg>
